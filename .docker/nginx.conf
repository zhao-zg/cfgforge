worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # gzip 压缩前端静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 5;

    server {
        listen 80;
        server_name _;

        # 前端静态文件
        root /app/web;
        index index.html;

        # API 反代到 Java 后端
        # 前端直接调 /schemas、/record 等路径（无 /api 前缀），按已知端点精确代理
        location ~ ^/(schemas|notes|noteUpdate|search|prompt|checkJson|recordRefIds|record|recordAddOrUpdate|recordDelete|schemaText|schemaWrite|createTable|createDataFile)(\\?|$) {
            proxy_pass http://127.0.0.1:3456;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # AI Chat SSE 需要关闭缓冲、加长超时
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # SPA 路由：非文件、非 API 请求回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
