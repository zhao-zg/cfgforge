services:
  cfggen:
    # 直接使用 GHCR 已构建的镜像（CI push tag v0.0.1 后自动发布）
    # 如需本地构建，注释 image 行并取消注释下方 build 段
    image: ghcr.io/zhao-zg/cfggen:0.0.1
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      # 挂载配置数据目录（须包含 config.cfg 等配表文件）
      - ./example/config:/data
    environment:
      - JAVA_PORT=3456
      - DATADIR=/data
    restart: unless-stopped
