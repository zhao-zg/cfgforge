services:
  cfggen:
    build:
      context: .
      dockerfile: Dockerfile
    # 若使用已发布的镜像，取消下行注释并注释 build 段
    # image: ghcr.io/stallboy/cfggen:latest
    ports:
      - "8080:80"
    volumes:
      # 挂载配置数据目录（须包含 config.cfg 等配表文件）
      - ./example/config:/data
    environment:
      - JAVA_PORT=3456
      - DATADIR=/data
    restart: unless-stopped
